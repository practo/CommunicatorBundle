parameters:
    practo_communicator.mail_patient.class: Practo\CommunicatorBundle\Clients\MailPatient
    practo_communicator.mail_doctor.class: Practo\CommunicatorBundle\Clients\MailDoctor
    practo_communicator.mail_staff.class: Practo\CommunicatorBundle\Clients\MailStaff
    practo_communicator.mail_appointment.class: Practo\CommunicatorBundle\Clients\MailAppointment
    practo_communicator.mail_generic.class: Practo\CommunicatorBundle\Clients\MailGeneric
    practo_communicator.sms_doctor.class: Practo\CommunicatorBundle\Clients\SmsDoctor
    practo_communicator.sms_patient.class: Practo\CommunicatorBundle\Clients\SmsPatient
    practo_communicator.sms_staff.class: Practo\CommunicatorBundle\Clients\SmsStaff
    practo_communicator.sms_credit.class: Practo\CommunicatorBundle\Clients\SmsCredit
    practo_communicator.sms_appointment.class: Practo\CommunicatorBundle\Clients\SmsAppointment
    practo_communicator.sms_generic.class: Practo\CommunicatorBundle\Clients\SmsGeneric
    practo_communicator.sms_generic_promotional.class: Practo\CommunicatorBundle\Clients\SmsGenericPromotional
    practo_communicator.sms_generic_transactional.class: Practo\CommunicatorBundle\Clients\SmsGenericTransactional
    practo_communicator.mail_generic_promotional.class: Practo\CommunicatorBundle\Clients\MailGenericPromotional
    practo_communicator.mail_generic_transactional.class: Practo\CommunicatorBundle\Clients\MailGenericTransactional
    practo_communicator.device_information.class: Practo\CommunicatorBundle\Clients\DeviceInformation

    communicator.send_mail_queue: mail_sender
    communicator.update_mail_queue: mail_updater
    communicator.error_mail_queue: mail_sender_error
    communicator.update_error_mail_queue: mail_update_error
    communicator.send_sms_queue: sms_sender
    communicator.update_sms_queue: sms_updater
    communicator.error_sms_queue: sms_sender_error
    communicator.update_error_sms_queue: sms_updater_error
    communicator.sms_credit: credit_handler
    communicator.send_appointment_sms_queue: appointment_sms_sender
    communicator.update_appointment_sms_queue: appointment_sms_updater

    communicator.queue.uri: 'beanstalk://localhost/dev_'
    legacy_queue.sqs_spool_dir: ~

    #communicator_config
    communicator.base_uri: %communicator.base_uri%
    communicator.api.secret: %communicator.api.secret%

services:
  practo_communicator.mail_patient:
    class: %practo_communicator.mail_patient.class%
    arguments:
      - @practo_communicator.queue
      - %communicator.api.secret%
      - %communicator.api.app_name%
    calls:
      - [ setRequest, [ '@?request=' ]]
  practo_communicator.mail_doctor:
    class: %practo_communicator.mail_doctor.class%
    arguments:
      - @practo_communicator.queue
      - %communicator.api.secret%
      - %communicator.api.app_name%
    calls:
      - [ setRequest, [ '@?request=' ]]
  practo_communicator.mail_staff:
    class: %practo_communicator.mail_staff.class%
    arguments:
      - @practo_communicator.queue
