parameters:
    practo_communicator.mail_patient.class: Practo\CommunicatorBundle\Clients\MailPatient
    practo_communicator.mail_doctor.class: Practo\CommunicatorBundle\Clients\MailDoctor
    practo_communicator.mail_staff.class: Practo\CommunicatorBundle\Clients\MailStaff
    practo_communicator.sms_doctor.class: Practo\CommunicatorBundle\Clients\SmsDoctor
    practo_communicator.sms_patient.class: Practo\CommunicatorBundle\Clients\SmsPatient
    practo_communicator.sms_staff.class: Practo\CommunicatorBundle\Clients\SmsStaff
    practo_communicator.sms_credit.class: Practo\CommunicatorBundle\Clients\SmsCredit

    communicator.send_mail_queue: mail_sender
    communicator.update_mail_queue: mail_updater
    communicator.error_mail_queue: mail_sender_error
    communicator.update_error_mail_queue: mail_update_error
    communicator.send_sms_queue: sms_sender
    communicator.update_sms_queue: sms_updater
    communicator.error_sms_queue: sms_sender_error
    communicator.update_error_sms_queue: sms_updater_error
    communicator.sms_credit: credit_handler

    communicator.host: 127.0.0.1

    #mails
    communicator.mail_patient.host: %communicator.host%
    communicator.mail_patient.port: 2020
    communicator.mail_doctor.host: %communicator.host%
    communicator.mail_doctor.port: 1010
    communicator.mail_staff.host: %communicator.host%
    communicator.mail_staff.port: 3030
    #sms
    communicator.sms_patient.host: %communicator.host%
    communicator.sms_patient.port: 6060
    communicator.sms_doctor.host: %communicator.host%
    communicator.sms_doctor.port: 5050
    communicator.sms_staff.host: %communicator.host%
    communicator.sms_staff.port: 7070
    #credits
    communicator.sms_credit.host: %communicator.host%
    communicator.sms_credit.port: 4040

services:
  practo_communicator.mail_patient:
    class: %practo_communicator.mail_patient.class%
    arguments:
      - @leezy.pheanstalk.communicator
      - %communicator.send_mail_queue%
      - %communicator.update_mail_queue%
      - %communicator.mail_patient.host%
      - %communicator.mail_patient.port%
      - RAY
  practo_communicator.mail_doctor:
    class: %practo_communicator.mail_doctor.class%
    arguments:
      - @leezy.pheanstalk.communicator
      - %communicator.send_mail_queue%
      - %communicator.update_mail_queue%
      - %communicator.mail_doctor.host%
      - %communicator.mail_doctor.port%
      - RAY
  practo_communicator.mail_staff:
    class: %practo_communicator.mail_staff.class%
    arguments:
      - @leezy.pheanstalk.communicator
      - %communicator.send_mail_queue%
      - %communicator.update_mail_queue%
      - %communicator.mail_staff.host%
      - %communicator.mail_staff.port%
      - RAY
  practo_communicator.sms_patient:
    class: %practo_communicator.sms_patient.class%
    arguments:
      - @leezy.pheanstalk.communicator
      - %communicator.send_sms_queue%
      - %communicator.update_sms_queue%
      - %communicator.sms_patient.host%
      - %communicator.sms_patient.port%
      - RAY
  practo_communicator.sms_doctor:
    class: %practo_communicator.sms_doctor.class%
    arguments:
      - @leezy.pheanstalk.communicator
      - %communicator.send_sms_queue%
      - %communicator.update_sms_queue%
      - %communicator.sms_doctor.host%
      - %communicator.sms_doctor.port%
      - RAY
  practo_communicator.sms_staff:
    class: %practo_communicator.sms_staff.class%
    arguments:
      - @leezy.pheanstalk.communicator
      - %communicator.send_sms_queue%
      - %communicator.update_sms_queue%
      - %communicator.mail_staff.host%
      - %communicator.mail_staff.port%
      - RAY
  practo_communicator.sms_credit:
    class: %practo_communicator.sms_credit.class%
    arguments:
      - @leezy.pheanstalk.communicator
      - %communicator.sms_credit%
      - %communicator.sms_credit.host%
      - %communicator.sms_credit.port%
