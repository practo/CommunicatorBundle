language: php

php:
  - 5.5.9

before_install:
  - sudo apt-get install -qq python-pip
  - sudo pip install -r requirements.lock

before_script:
  - pear install PHP_CodeSniffer-3.0.0a1
  - phpenv rehash
  - (cd $(pyrus get php_dir | tail -1)/PHP/CodeSniffer/Standards && test -d Symfony2 || git clone -q https://github.com/ajayrungta/Symfony2-coding-standard.git Symfony2)
  - composer self-update
  - composer install -n

script: fab polish:ci
